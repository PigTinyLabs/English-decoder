<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<title>English Decoder :: IPA Compiler</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root {
    --bg: #0a0e14; --surface: #12161f; --surface-alt: #171c26;
    --border: #232a37; --text: #e7e9ee; --muted: #8b93a3;
    --emerald: #34d399; --amber: #fbbf24; --red: #f87171; --cyan: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: 'JetBrains Mono', monospace; padding: 28px;
  }
  #app { max-width: 860px; margin: 0 auto; }
  .header { margin-bottom: 20px; }
  .title { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; margin: 0; }
  .title span { color: var(--emerald); }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .tabs { display: flex; gap: 2px; margin-bottom: 18px; border-bottom: 1px solid var(--border); }
  .tab { background: transparent; border: none; color: var(--muted); font-family: 'JetBrains Mono', monospace;
    font-size: 13px; padding: 9px 16px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tab.active { color: var(--text); border-bottom-color: var(--emerald); }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; display: none; }
  .panel.active { display: block; }
  .promptline { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .caret { color: var(--emerald); font-weight: 700; }
  .input { flex: 1; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 6px;
    color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 9px 12px; outline: none; }
  .input:focus { border-color: var(--cyan); }
  .btn { background: var(--emerald); color: #071410; border: none; border-radius: 6px; font-weight: 700;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 9px 16px; cursor: pointer; white-space: nowrap; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
  .status { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .status.err { color: var(--red); }
  .worddef { margin-bottom: 16px; padding-bottom: 14px; border-bottom: 1px dashed var(--border); }
  .word { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
  .pos { color: var(--amber); font-size: 12px; margin-left: 8px; }
  .def { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .buildline { display: flex; flex-wrap: wrap; gap: 6px; min-height: 44px; padding: 10px 12px;
    background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 16px; align-items: center; }
  .tok { font-size: 17px; padding: 4px 9px; border-radius: 5px; background: rgba(52,211,153,0.12);
    color: var(--emerald); border: 1px solid rgba(52,211,153,0.35); }
  .tok.stress { color: var(--amber); background: rgba(251,191,36,0.1); border-color: rgba(251,191,36,0.3); }
  .cursor { width: 2px; height: 20px; background: var(--text); animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .chip { font-size: 17px; padding: 7px 13px; border-radius: 6px; background: var(--surface-alt);
    border: 1px solid var(--border); color: var(--text); cursor: pointer; transition: transform .1s, border-color .1s; }
  .chip:hover { border-color: var(--cyan); transform: translateY(-1px); }
  .chip.used { opacity: 0.25; pointer-events: none; }
  .chip.error { border-color: var(--red); color: var(--red); animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .runrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .locked { color: var(--muted); font-size: 12.5px; }
  .unlocked { color: var(--emerald); font-size: 12.5px; }
  .log { margin-top: 22px; border-top: 1px solid var(--border); padding-top: 14px; }
  .logrow { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--muted); padding: 4px 0; }
  .logrow b { color: var(--text); }
  .board-group { margin-bottom: 22px; }
  .board-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; color: var(--cyan); margin-bottom: 10px; }
  .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; }
  .board-cell { background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 6px; text-align: center; cursor: pointer; }
  .board-cell:hover { border-color: var(--emerald); }
  .board-sym { font-size: 18px; display: block; }
  .board-ex { font-size: 10.5px; color: var(--muted); display: block; margin-top: 3px; }
  .board-mouth { display: flex; justify-content: center; margin-bottom: 4px; }
  .mouth-svg { width: 44px; height: 44px; }
  /* Practice Tab Styles */
  .practice-box { text-align: center; margin-top: 20px; }
  .target-word { font-size: 28px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; margin-bottom: 4px; }
  .target-ipa { font-size: 18px; color: var(--muted); margin-bottom: 24px; }
  .mic-btn { background: var(--surface-alt); border: 2px solid var(--border); border-radius: 50%;
    width: 64px; height: 64px; display: inline-flex; align-items: center; justify-content: center;
    font-size: 24px; cursor: pointer; transition: all 0.2s; color: var(--text); margin-bottom: 24px; }
  .mic-btn:hover { border-color: var(--cyan); color: var(--cyan); }
  .mic-btn.recording { border-color: var(--red); color: var(--red); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(248, 113, 113, 0); } 100% { box-shadow: 0 0 0 0 rgba(248, 113, 113, 0); } }
  .diff-box { background: var(--bg); padding: 16px; border-radius: 8px; border: 1px solid var(--border); min-height: 80px; }
  .diff-word { font-size: 16px; margin-bottom: 8px; color: var(--muted); }
  .diff-result { font-size: 24px; font-weight: bold; letter-spacing: 2px; }
  .correct { color: var(--emerald); }
  .wrong { color: var(--red); text-decoration: line-through; opacity: 0.8; }
  .missing { color: var(--red); border-bottom: 2px dashed var(--red); opacity: 0.8; }
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1 class="title">English <span>Decoder</span> :: IPA Compiler</h1>
    <div class="sub">nhập từ → parse phiên âm → giải mã token → run audio (gọi API thật: dictionaryapi.dev)</div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="parser">word_parser.ts</button>
    <button class="tab" data-tab="board">ipa_board.ts</button>
    <button class="tab" data-tab="practice">speech_practice.ts</button>
  </div>

  <div class="panel active" id="panel-parser">
    <div class="promptline">
      <span class="caret">&gt;</span>
      <input class="input" id="wordInput" placeholder="nhập một từ tiếng Anh..." value="buy" autocomplete="off" spellcheck="false" />
      <button class="btn" id="parseBtn">Parse</button>
    </div>
    <div id="statusBox"></div>
    <div id="resultBox"></div>
    <div id="logBox"></div>
  </div>

  <div class="panel" id="panel-practice">
    <div class="promptline">
      <span class="caret">&gt;</span>
      <input class="input" id="pracInput" placeholder="nhập một từ tiếng Anh cần luyện..." autocomplete="off" spellcheck="false" />
      <button class="btn" id="pracParseBtn">Cập nhật</button>
    </div>
    <div class="sub" style="margin-top: -10px; margin-bottom: 20px;">Luyện đọc từ mục tiêu. Trình duyệt cần cấp quyền Microphone (Google Chrome).</div>
    <div class="practice-box" id="practiceBox">
      <div style="display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 4px;">
        <div class="target-word" id="pracTargetWord" style="margin-bottom: 0;">...</div>
        <button class="btn ghost" id="pracPlayBtn" style="padding: 0; width: 32px; height: 32px; display: none; align-items: center; justify-content: center; border-radius: 50%; font-size: 16px;" title="Nghe mẫu">🔊</button>
      </div>
      <div class="target-ipa" id="pracTargetIpa">/.../</div>
      <button class="mic-btn" id="micBtn" title="Bấm để ghi âm">🎤</button>
      <div class="diff-box">
        <div class="diff-word" id="pracSpokenWord">Nhấn mic và đọc to từ trên</div>
        <div class="diff-result" id="pracDiffResult"></div>
      </div>
    </div>
  </div>

  <div class="panel" id="panel-board">
    <div class="status">Click vào ký hiệu để nghe ví dụ (dùng giọng đọc trình duyệt).</div>
    <div id="boardBox"></div>
  </div>
</div>

<script>
// ---- IPA tokenizer -------------------------------------------------------
const IPA_SYMBOLS = [
  "tʃ","dʒ","eɪ","aɪ","ɔɪ","aʊ","əʊ","oʊ","ɪə","eə","ʊə",
  "iː","ɑː","ɔː","uː","ɜː",
  "p","b","t","d","k","g","f","v","θ","ð","s","z","ʃ","ʒ",
  "h","m","n","ŋ","l","r","ɹ","j","w",
  "ɪ","e","æ","ʌ","ɒ","ʊ","ə","ɚ","ɝ","a","i","u","o",
].sort((a,b) => b.length - a.length);
const STRESS = new Set(["ˈ","ˌ","."]);

function tokenizePhonetic(raw) {
  const clean = raw.replace(/[/\[\]]/g, "").trim();
  const tokens = [];
  let i = 0;
  while (i < clean.length) {
    const ch = clean[i];
    if (STRESS.has(ch)) { tokens.push(ch); i++; continue; }
    if (ch === " ") { i++; continue; }
    let matched = null;
    for (const sym of IPA_SYMBOLS) {
      if (clean.startsWith(sym, i)) { matched = sym; break; }
    }
    if (matched) { tokens.push(matched); i += matched.length; }
    else { tokens.push(ch); i++; }
  }
  return tokens;
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function speak(text) {
  const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`;
  const audio = new Audio(url);
  audio.play().catch(e => console.warn("TTS play failed:", e));
}

// Speaks a sequence of texts one after another using Youdao TTS
function speakSequence(texts, { pauseMs = 350 } = {}) {
  const queue = texts.filter(Boolean);
  const speakNext = (i) => {
    if (i >= queue.length) return;
    const url = `https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(queue[i])}&type=2`;
    const audio = new Audio(url);
    audio.onended = () => setTimeout(() => speakNext(i + 1), pauseMs);
    audio.onerror = () => speakNext(i + 1);
    audio.play().catch(() => speakNext(i + 1));
  };
  speakNext(0);
}

// ---- Local Audio Files Integration -------------------------------------------------------
// Đã tải 44 file âm thanh chuẩn vào thư mục /audio/

async function speakIpaThenWord(sym, example) {
  try {
    const audioUrl = `audio/${encodeURIComponent(sym)}.mp3`;
    const audio = new Audio(audioUrl);
    await new Promise((resolve, reject) => {
      audio.onended = resolve;
      audio.onerror = reject;
      audio.play().catch(reject);
    });
    // Nghỉ một chút rồi đọc từ ví dụ bằng giọng trình duyệt
    setTimeout(() => {
      speakSequence([example], { rate: 0.85, pauseMs: 0 });
    }, 200);
  } catch (e) {
    // Fallback: nếu lỗi không tải được audio (ví dụ chạy trên môi trường không hỗ trợ)
    // thì chỉ đọc từ ví dụ.
    speakSequence([example]);
  }
}

// ---- Mouth-shape (khẩu hình) generator -------------------------------------------------------
// Đơn giản hóa: nhìn thẳng mặt, không phải cắt lớp bên như hình ảnh tham khảo của Google.
// rounded: 0 (dẹt/spread) -> 1 (tròn/pushed forward)
// openness: 0 (khép) -> 1 (mở rộng)
// teeth: có lộ răng trên/dưới không
// closed: môi mím lại hoàn toàn (p, b, m)
// lipToTeeth: răng trên chạm môi dưới (f, v)
// tongueBetween: đầu lưỡi lộ giữa hai hàm răng (θ, ð)
const MOUTH_PARAMS = {
  // ── Nguyên âm đơn (Monophthongs) ─────────────────────────────────────────
  "iː": { rounded: 0,   openness: 0.15, teeth: true  },  // see  – dẹt rộng, hé nhỏ
  "ɪ":  { rounded: 0,   openness: 0.2,  teeth: true  },  // sit  – dẹt, hé hơn iː
  "e":  { rounded: 0,   openness: 0.35, teeth: false },  // bed  – dẹt vừa
  "æ":  { rounded: 0,   openness: 0.75, teeth: false },  // cat  – mở rộng
  "ɑː": { rounded: 0.1, openness: 0.9,  teeth: false },  // car  – há to nhất
  "ɒ":  { rounded: 0.5, openness: 0.7,  teeth: false },  // hot  – tròn, mở rộng (British)
  "ɔː": { rounded: 0.6, openness: 0.55, teeth: false },  // law  – tròn vừa
  "ʊ":  { rounded: 0.7, openness: 0.25, teeth: false },  // put  – tròn, hé nhỏ
  "uː": { rounded: 0.9, openness: 0.2,  teeth: false },  // blue – tròn nhất, môi chúm
  "ʌ":  { rounded: 0.2, openness: 0.45, teeth: false },  // cup  – hơi dẹt, mở vừa
  "ɜː": { rounded: 0.3, openness: 0.35, teeth: false },  // bird – môi dẹt nhẹ
  "ə":  { rounded: 0.2, openness: 0.3,  teeth: false },  // about– schwa, trung tính
  // Âm không nhấn trong American English
  "ɚ":  { rounded: 0.3, openness: 0.3,  teeth: false },  // butter (unstressed r-colored)
  "ɝ":  { rounded: 0.3, openness: 0.35, teeth: false },  // bird   (stressed r-colored)
  // Ký hiệu rút gọn xuất hiện trong một số bộ từ điển
  "a":  { rounded: 0,   openness: 0.85, teeth: false },  // trap (short open)
  "i":  { rounded: 0,   openness: 0.15, teeth: true  },  // happy (weak i)
  "u":  { rounded: 0.8, openness: 0.2,  teeth: false },  // situation (short u)
  "o":  { rounded: 0.6, openness: 0.4,  teeth: false },  // go (short o)

  // ── Nguyên âm đôi (Diphthongs) ───────────────────────────────────────────
  "eɪ": { rounded: 0.1, openness: 0.3,  teeth: false },  // day  – bắt đầu /e/
  "aɪ": { rounded: 0,   openness: 0.8,  teeth: false },  // my   – bắt đầu /a/ mở rộng
  "ɔɪ": { rounded: 0.6, openness: 0.5,  teeth: false },  // boy  – bắt đầu /ɔ/
  "aʊ": { rounded: 0.3, openness: 0.75, teeth: false },  // now  – bắt đầu /a/
  "əʊ": { rounded: 0.5, openness: 0.3,  teeth: false },  // go   – bắt đầu /ə/
  "ɪə": { rounded: 0,   openness: 0.25, teeth: true  },  // here – bắt đầu /ɪ/
  "eə": { rounded: 0,   openness: 0.4,  teeth: false },  // hair – bắt đầu /e/
  "ʊə": { rounded: 0.6, openness: 0.3,  teeth: false },  // tour – bắt đầu /ʊ/

  // ── Phụ âm (Consonants) ──────────────────────────────────────────────────
  // Plosives – môi/lưỡi đóng hoàn toàn khi tích năng lượng
  "p":  { closed: true },                                  // pen  – hai môi chạm nhau
  "b":  { closed: true },                                  // bad  – hai môi chạm nhau
  "t":  { rounded: 0,   openness: 0.25, teeth: true  },  // tea  – lưỡi chạm lợi
  "d":  { rounded: 0,   openness: 0.25, teeth: true  },  // did  – lưỡi chạm lợi
  "k":  { rounded: 0,   openness: 0.35, teeth: false },  // cat  – lưỡi chạm vòm mềm
  "g":  { rounded: 0,   openness: 0.35, teeth: false },  // go   – lưỡi chạm vòm mềm
  // Labiodentals – răng trên chạm môi dưới
  "f":  { lipToTeeth: true },                              // fall
  "v":  { lipToTeeth: true },                              // van
  // Dentals – đầu lưỡi lộ giữa hai hàm răng
  "θ":  { rounded: 0,   openness: 0.2,  tongueBetween: true }, // think
  "ð":  { rounded: 0,   openness: 0.2,  tongueBetween: true }, // this
  // Sibilants
  "s":  { rounded: 0,   openness: 0.15, teeth: true  },  // so
  "z":  { rounded: 0,   openness: 0.15, teeth: true  },  // zoo
  "ʃ":  { rounded: 0.4, openness: 0.25, teeth: true  },  // she  – môi hơi tròn ra trước
  "ʒ":  { rounded: 0.4, openness: 0.25, teeth: true  },  // vision
  // Affricates – bắt đầu đóng như /t,d/ rồi xả ra như /ʃ,ʒ/
  "tʃ": { rounded: 0.1, openness: 0.15, teeth: true  },  // chair – bắt đầu gần đóng
  "dʒ": { rounded: 0.1, openness: 0.15, teeth: true  },  // jump  – bắt đầu gần đóng
  // Nasals – miệng gần khép, âm thoát qua mũi
  "m":  { closed: true },                                  // man  – hai môi đóng
  "n":  { rounded: 0,   openness: 0.2,  teeth: true  },  // no   – lưỡi chạm lợi
  "ŋ":  { rounded: 0,   openness: 0.15, teeth: false },  // sing – lưỡi chạm vòm mềm, miệng gần khép
  // Approximants
  "l":  { rounded: 0,   openness: 0.25, teeth: true  },  // leg  – lưỡi chạm lợi, hơi hé
  "r":  { rounded: 0.4, openness: 0.3,  teeth: false },  // red  – môi hơi tròn (British)
  "ɹ":  { rounded: 0.35,openness: 0.3,  teeth: false },  // red  – r Mỹ, cuộn lưỡi
  "j":  { rounded: 0,   openness: 0.15, teeth: true  },  // yes
  "w":  { rounded: 0.9, openness: 0.15, teeth: false },  // wet  – môi chúm tròn nhất
  "h":  { rounded: 0,   openness: 0.5,  teeth: false },  // hot  – miệng mở tự nhiên
};

// Vị trí KẾT của âm đôi (diphthong) + affricate — miệng lướt từ MOUTH_PARAMS sang đây.
const MOUTH_PARAMS_END = {
  // Diphthongs: glide sang nguyên âm thứ hai
  "eɪ": { rounded: 0,   openness: 0.15, teeth: true  },  // -> /ɪ/
  "aɪ": { rounded: 0,   openness: 0.15, teeth: true  },  // -> /ɪ/
  "ɔɪ": { rounded: 0,   openness: 0.15, teeth: true  },  // -> /ɪ/
  "aʊ": { rounded: 0.9, openness: 0.2  },                // -> /ʊ/
  "əʊ": { rounded: 0.9, openness: 0.15 },                // -> /ʊ/
  "ɪə": { rounded: 0.2, openness: 0.3  },                // -> /ə/
  "eə": { rounded: 0.2, openness: 0.3  },                // -> /ə/
  "ʊə": { rounded: 0.2, openness: 0.3  },                // -> /ə/
  // Affricates: sau pha đóng, xả ra như /ʃ/ hoặc /ʒ/
  "tʃ": { rounded: 0.4, openness: 0.25, teeth: true  },  // -> /ʃ/ release
  "dʒ": { rounded: 0.4, openness: 0.25, teeth: true  },  // -> /ʒ/ release
};

// Trạng thái nghỉ (môi thả lỏng, gần khép) — điểm xuất phát/kết thúc của animation.
const MOUTH_NEUTRAL = { rounded: 0.1, openness: 0.08, teeth: false };

// Quy đổi mọi tham số (kể cả closed/lipToTeeth) về một bộ số duy nhất để có thể animate mượt.
function paramsToGeom(p) {
  if (p.closed) return { rx: 15, ry: 1.5, teethOp: 0, tongueOp: 0 };
  if (p.lipToTeeth) return { rx: 14, ry: 5, teethOp: 0.9, tongueOp: 0 };
  const rounded = p.rounded || 0;
  const openness = p.openness != null ? p.openness : 0.3;
  return {
    rx: 17 - rounded * 6,
    ry: 4 + openness * 13,
    teethOp: p.teeth ? 0.85 : 0,
    tongueOp: p.tongueBetween ? 0.75 : 0,
  };
}

function buildMouthSVG(uid) {
  const stroke = "#8b93a3";
  const lipStroke = "#38bdf8";
  const g = paramsToGeom(MOUTH_NEUTRAL);
  const trans = "transition: rx .25s ease, ry .25s ease, opacity .25s ease;";
  return `<svg viewBox="0 0 64 64" class="mouth-svg">
    <circle cx="32" cy="32" r="27" fill="none" stroke="${stroke}" stroke-width="1.5" opacity="0.35"/>
    <ellipse id="mo-${uid}" cx="32" cy="32" rx="${g.rx}" ry="${g.ry}" fill="#0a0e14" stroke="${lipStroke}" stroke-width="2.5" style="${trans}"/>
    <rect id="tt-${uid}" x="${32 - 15 + 2}" y="27" width="26" height="6" rx="1.5" fill="#e7e9ee" opacity="${g.teethOp}" style="${trans}"/>
    <rect id="tb-${uid}" x="${32 - 15 + 2}" y="31" width="26" height="6" rx="1.5" fill="#e7e9ee" opacity="${g.teethOp * 0.6}" style="${trans}"/>
    <ellipse id="tg-${uid}" cx="32" cy="32" rx="7" ry="3" fill="#f87171" opacity="${g.tongueOp}" style="${trans}"/>
  </svg>`;
}

function setMouthGeom(uid, g) {
  const mo = document.getElementById(`mo-${uid}`);
  const tt = document.getElementById(`tt-${uid}`);
  const tb = document.getElementById(`tb-${uid}`);
  const tg = document.getElementById(`tg-${uid}`);
  if (!mo) return;
  mo.setAttribute("rx", g.rx);
  mo.setAttribute("ry", g.ry);
  tt.setAttribute("opacity", g.teethOp);
  tb.setAttribute("opacity", g.teethOp * 0.6);
  tg.setAttribute("opacity", g.tongueOp);
}

// Chuỗi animation: nghỉ -> hình âm -> (lướt sang hình 2 nếu là âm đôi) -> về nghỉ.
function animateMouth(uid, sym) {
  const target = paramsToGeom(MOUTH_PARAMS[sym] || {});
  const endParams = MOUTH_PARAMS_END[sym];
  const end = endParams ? paramsToGeom(endParams) : null;
  const neutral = paramsToGeom(MOUTH_NEUTRAL);

  setMouthGeom(uid, neutral);
  requestAnimationFrame(() => setMouthGeom(uid, target));
  if (end) {
    setTimeout(() => setMouthGeom(uid, end), 550);
    setTimeout(() => setMouthGeom(uid, neutral), 1300);
  } else {
    setTimeout(() => setMouthGeom(uid, neutral), 900);
  }
}
const IPA_BOARD = {
  "Nguyên âm — Vowels": [["iː","see"],["ɪ","sit"],["e","bed"],["æ","cat"],["ɑː","car"],["ɒ","hot"],
    ["ɔː","law"],["ʊ","put"],["uː","blue"],["ʌ","cup"],["ɜː","bird"],["ə","about"]],
  "Nguyên âm đôi — Diphthongs": [["eɪ","day"],["aɪ","my"],["ɔɪ","boy"],["aʊ","now"],["əʊ","go"],
    ["ɪə","here"],["eə","hair"],["ʊə","tour"]],
  "Phụ âm — Consonants": [["p","pen"],["b","bad"],["t","tea"],["d","did"],["k","cat"],["g","go"],
    ["f","fall"],["v","van"],["θ","think"],["ð","this"],["s","so"],["z","zoo"],["ʃ","she"],["ʒ","vision"],
    ["tʃ","chair"],["dʒ","jump"],["m","man"],["n","no"],["ŋ","sing"],["l","leg"],["r","red"],["ɹ","red"],
    ["j","yes"],["w","wet"],["h","hot"]],
};

// ---- State -------------------------------------------------------
let state = {
  status: "idle", data: null, targetTokens: [], bank: [], built: [], mistakes: 0, decoded: false, log: [],
};
let idc = 0;

const statusBox = document.getElementById("statusBox");
const resultBox = document.getElementById("resultBox");
const logBox = document.getElementById("logBox");
const wordInput = document.getElementById("wordInput");
const parseBtn = document.getElementById("parseBtn");

document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".panel").forEach(p => p.classList.remove("active"));
    tab.classList.add("active");
    document.getElementById("panel-" + tab.dataset.tab).classList.add("active");
    if (tab.dataset.tab === "practice") {
      if (typeof initSpeechPractice === "function") initSpeechPractice();
    }
  });
});

async function runParse(word) {
  const w = word.trim().toLowerCase();
  if (!w) return;
  state.status = "loading"; state.data = null; state.decoded = false;
  state.built = []; state.mistakes = 0;
  render();
  try {
    const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(w)}`);
    if (!res.ok) throw new Error("NOT_FOUND");
    const json = await res.json();
    const entry = json[0];
    const phoneticObj = entry.phonetics.find(p => p.text && p.audio) || entry.phonetics.find(p => p.text) || null;
    const phoneticText = (phoneticObj && phoneticObj.text) || entry.phonetic || "";
    if (!phoneticText) throw new Error("NO_PHONETIC");
    const audioEntry = entry.phonetics.find(p => p.audio);
    const audio = audioEntry ? audioEntry.audio : "";
    const meaning = entry.meanings && entry.meanings[0];
    const def = (meaning && meaning.definitions && meaning.definitions[0] && meaning.definitions[0].definition) || "";
    const pos = (meaning && meaning.partOfSpeech) || "";

    const tokens = tokenizePhonetic(phoneticText);
    const bankTokens = shuffle(tokens).map(sym => ({ id: idc++, sym, used: false, error: false }));

    state.data = { word: w, phoneticText, audio, def, pos };
    state.targetTokens = tokens;
    state.bank = bankTokens;
    state.status = "ready";
  } catch (e) {
    state.status = "error";
    state.errorMsg = e.message === "NO_PHONETIC"
      ? `Không có dữ liệu phiên âm cho "${w}".`
      : `Không tìm thấy "${w}" trong từ điển.`;
  }
  render();
}

function handleBankClick(item) {
  if (item.used || state.decoded) return;
  const expected = state.targetTokens[state.built.length];
  if (item.sym === expected) {
    item.used = true;
    state.built.push(item.sym);
    if (state.built.length === state.targetTokens.length) {
      state.decoded = true;
      state.log.unshift({ word: state.data.word, phonetic: state.data.phoneticText, mistakes: state.mistakes });
      state.log = state.log.slice(0, 8);
    }
  } else {
    state.mistakes++;
    item.error = true;
    render();
    setTimeout(() => { item.error = false; render(); }, 350);
    return;
  }
  render();
}

function playAudio() {
  if (state.data && state.data.audio) {
    const url = state.data.audio.startsWith("http") ? state.data.audio : `https:${state.data.audio}`;
    const audio = new Audio(url);
    audio.play().catch(() => speak(state.data.word));
  } else if (state.data) {
    speak(state.data.word);
  }
}

function resetPuzzle() {
  state.bank.forEach(b => { b.used = false; b.error = false; });
  state.bank = shuffle(state.bank);
  state.built = [];
  state.decoded = false;
  state.mistakes = 0;
  render();
}

function render() {
  // status
  if (state.status === "error") {
    statusBox.innerHTML = `<div class="status err">✗ ${state.errorMsg}</div>`;
  } else if (state.status === "idle") {
    statusBox.innerHTML = `<div class="status">Sẵn sàng. Gõ một từ rồi nhấn Parse để lấy phiên âm từ dictionaryapi.dev.</div>`;
  } else if (state.status === "loading") {
    statusBox.innerHTML = `<div class="status">Đang parse…</div>`;
  } else {
    statusBox.innerHTML = "";
  }
  parseBtn.disabled = state.status === "loading";
  parseBtn.textContent = state.status === "loading" ? "parsing…" : "Parse";

  // result
  if (state.data && state.status === "ready") {
    const d = state.data;
    const cleanPhon = d.phoneticText.replace(/[/[\]]/g, "");
    resultBox.innerHTML = `
      <div class="worddef">
        <span class="word">${d.word}</span>
        ${d.pos ? `<span class="pos">${d.pos}</span>` : ""}
        ${d.def ? `<div class="def">${d.def}</div>` : ""}
      </div>
      <div class="label">build trace — click đúng thứ tự token để tái tạo <span style="text-transform: none; font-family: monospace;">/${cleanPhon}/</span></div>
      <div class="buildline" id="buildline"></div>
      ${!state.decoded ? `<div class="bank" id="bankBox"></div>` : ""}
      <div class="runrow">
        <button class="btn" id="runBtn" ${!state.decoded ? "disabled" : ""}>▶ Run (nghe phát âm)</button>
        <span class="${state.decoded ? 'unlocked' : 'locked'}">${state.decoded ? '✓ decoded' : '🔒 giải mã hết token để mở khóa'} · lỗi: ${state.mistakes}</span>
        <button class="btn ghost" id="resetBtn">reset puzzle</button>
      </div>
    `;
    const buildline = document.getElementById("buildline");
    state.built.forEach(t => {
      const span = document.createElement("span");
      span.className = "tok" + (STRESS.has(t) ? " stress" : "");
      span.textContent = t;
      buildline.appendChild(span);
    });
    if (!state.decoded) {
      const cursor = document.createElement("span");
      cursor.className = "cursor";
      buildline.appendChild(cursor);

      const bankBox = document.getElementById("bankBox");
      state.bank.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "chip" + (item.used ? " used" : "") + (item.error ? " error" : "");
        btn.textContent = item.sym;
        btn.addEventListener("click", () => handleBankClick(item));
        bankBox.appendChild(btn);
      });
    }
    document.getElementById("runBtn").addEventListener("click", playAudio);
    document.getElementById("resetBtn").addEventListener("click", resetPuzzle);
  } else {
    resultBox.innerHTML = "";
  }

  // log
  if (state.log.length > 0) {
    logBox.innerHTML = `<div class="log"><div class="label">decode log (session)</div>${
      state.log.map(l => `<div class="logrow"><span><b>${l.word}</b> — /${l.phonetic.replace(/[/[\]]/g,"")}/</span><span>lỗi: ${l.mistakes}</span></div>`).join("")
    }</div>`;
  } else {
    logBox.innerHTML = "";
  }
}

parseBtn.addEventListener("click", () => runParse(wordInput.value));
wordInput.addEventListener("keydown", e => { if (e.key === "Enter") runParse(wordInput.value); });

// ---- IPA board render -------------------------------------------------------
const boardBox = document.getElementById("boardBox");
Object.entries(IPA_BOARD).forEach(([group, items]) => {
  const groupDiv = document.createElement("div");
  groupDiv.className = "board-group";
  groupDiv.innerHTML = `<div class="board-title">${group}</div>`;
  const grid = document.createElement("div");

  items.forEach(([sym, example]) => {
    const cell = document.createElement("div");
    cell.className = "board-cell";
    const uid = `${group.length}-${sym}`.replace(/[^a-zA-Z0-9]/g, "_") + "-" + (idc++);
    const mouthSvg = buildMouthSVG(uid);
    cell.innerHTML = `<div class="board-mouth">${mouthSvg}</div><span class="board-sym">${sym}</span><span class="board-ex">${example}</span>`;
    cell.addEventListener("click", () => {
      animateMouth(uid, sym);
      speakIpaThenWord(sym, example);
    });
    grid.appendChild(cell);

  groupDiv.appendChild(grid);
  boardBox.appendChild(groupDiv);
});

render();

// ---- Speech Practice Logic -------------------------------------------------------
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
}

const micBtn = document.getElementById("micBtn");
const pracTargetWord = document.getElementById("pracTargetWord");
const pracTargetIpa = document.getElementById("pracTargetIpa");
const pracSpokenWord = document.getElementById("pracSpokenWord");
const pracDiffResult = document.getElementById("pracDiffResult");
const pracInput = document.getElementById("pracInput");
const pracParseBtn = document.getElementById("pracParseBtn");
const pracPlayBtn = document.getElementById("pracPlayBtn");

function initSpeechPractice() {
  if (!state.data || !state.data.word) {
    pracTargetWord.textContent = "Chưa có từ";
    pracTargetIpa.textContent = "Hãy nhập một từ vào ô trên";
    pracPlayBtn.style.display = "none";
    return;
  }
  pracTargetWord.textContent = state.data.word;
  pracTargetIpa.textContent = "/" + state.data.phoneticText.replace(/[/[\]]/g, "") + "/";
  pracPlayBtn.style.display = "flex";
  pracSpokenWord.textContent = "Nhấn mic và đọc to từ trên";
  pracDiffResult.innerHTML = "";
  micBtn.classList.remove("recording");
  pracInput.value = state.data.word;
}

pracParseBtn.addEventListener("click", async () => {
  const w = pracInput.value.trim();
  if (w) {
    pracTargetWord.textContent = "Đang tra từ...";
    pracTargetIpa.textContent = "/.../";
    pracDiffResult.innerHTML = "";
    pracPlayBtn.style.display = "none";
    await runParse(w);
    initSpeechPractice();
  }
});
pracInput.addEventListener("keydown", e => { if (e.key === "Enter") pracParseBtn.click(); });
pracPlayBtn.addEventListener("click", playAudio);

function renderDiff(targetTokens, spokenTokens) {
  const n = targetTokens.length, m = spokenTokens.length;
  const dp = Array(n + 1).fill(null).map(() => Array(m + 1).fill(0));
  for (let i = 1; i <= n; i++) {
    for (let j = 1; j <= m; j++) {
      if (targetTokens[i-1] === spokenTokens[j-1]) dp[i][j] = dp[i-1][j-1] + 1;
      else dp[i][j] = Math.max(dp[i-1][j], dp[i][j-1]);
    }
  }
  let i = n, j = m;
  const result = [];
  while (i > 0 && j > 0) {
    if (targetTokens[i-1] === spokenTokens[j-1]) {
      result.unshift({ type: "correct", val: targetTokens[i-1] });
      i--; j--;
    } else if (dp[i-1][j] >= dp[i][j-1]) {
      result.unshift({ type: "missing", val: targetTokens[i-1] });
      i--;
    } else {
      result.unshift({ type: "wrong", val: spokenTokens[j-1] });
      j--;
    }
  }
  while (i > 0) { result.unshift({ type: "missing", val: targetTokens[i-1] }); i--; }
  while (j > 0) { result.unshift({ type: "wrong", val: spokenTokens[j-1] }); j--; }
  
  let html = "/";
  for (const r of result) {
    if (r.type === "correct") html += `<span class="correct">${r.val}</span>`;
    else if (r.type === "wrong") html += `<span class="wrong" title="bạn đã phát âm dư âm này">${r.val}</span>`;
    else if (r.type === "missing") html += `<span class="missing" title="bạn phát âm sai hoặc thiếu âm này">${r.val}</span>`;
  }
  html += "/";
  pracDiffResult.innerHTML = html;
}

if (micBtn) {
  micBtn.addEventListener("click", () => {
    if (!recognition) {
      alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói (Web Speech API). Vui lòng dùng Google Chrome hoặc Edge.");
      return;
    }
    if (!state.data || !state.data.word) return;
    
    // Nếu đang thu âm thì bấm để dừng sớm
    if (micBtn.classList.contains("recording")) {
      micBtn.classList.remove("recording");
      if (pracSpokenWord.textContent.includes("Đang nghe")) {
        pracSpokenWord.textContent = "Đã dừng thu âm.";
      }
      try { recognition.stop(); } catch(e) {}
      return;
    }
    
    micBtn.classList.add("recording");
    pracSpokenWord.textContent = "Đang nghe... (Bấm mic lần nữa để kết thúc)";
    pracDiffResult.innerHTML = "";
    
    try { recognition.start(); } catch(e) {}
  });
  
  if (recognition) {
    recognition.onresult = async (event) => {
      const spoken = event.results[0][0].transcript.trim().toLowerCase();
      // Loại bỏ các dấu câu
      const cleanSpoken = spoken.replace(/[.,!?]/g, "");
      pracSpokenWord.textContent = `Bạn đã đọc: "${cleanSpoken}"`;
      micBtn.classList.remove("recording");
      
      if (cleanSpoken === state.data.word.toLowerCase()) {
        renderDiff(state.targetTokens, state.targetTokens);
      } else {
        pracDiffResult.innerHTML = `<span style="font-size: 13px; color: var(--muted)">Đang phân tích lỗi sai...</span>`;
        try {
          // Lấy phiên âm của từ người dùng vừa nói từ dictionaryapi.dev
          const res = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(cleanSpoken)}`);
          if (!res.ok) throw new Error("Not found");
          const json = await res.json();
          let spokenPhonetic = "";
          for (const item of json) {
            if (item.phonetic) { spokenPhonetic = item.phonetic; break; }
            if (item.phonetics) {
              const p = item.phonetics.find(x => x.text);
              if (p) { spokenPhonetic = p.text; break; }
            }
          }
          if (!spokenPhonetic) throw new Error("No IPA");
          
          const spokenTokens = tokenizeIpa(spokenPhonetic.replace(/[/[\]]/g, ""));
          renderDiff(state.targetTokens, spokenTokens);
        } catch (e) {
          pracDiffResult.innerHTML = `<span class="wrong" style="font-size: 14px;">Không tìm thấy phiên âm cho từ "${cleanSpoken}"</span>`;
        }
      }
    };
    recognition.onspeechend = () => {
      try { recognition.stop(); } catch(e) {}
      micBtn.classList.remove("recording");
    };
    recognition.onend = () => {
      micBtn.classList.remove("recording");
    };
    recognition.onerror = (event) => {
      micBtn.classList.remove("recording");
      if (event.error === 'not-allowed') {
         alert("⚠️ Trình duyệt đang chặn Microphone!\n\nVui lòng bấm vào biểu tượng 🔒 (hoặc nút Tuỳ chỉnh) trên thanh địa chỉ trang web và chọn 'Allow' (Cho phép) Microphone để có thể thu âm.");
         pracSpokenWord.textContent = "Chưa cấp quyền Microphone.";
      } else if (event.error !== 'no-speech' && event.error !== 'aborted') {
         pracSpokenWord.textContent = `Lỗi thu âm: ${event.error}`;
      } else if (event.error === 'no-speech') {
         pracSpokenWord.textContent = "Không nghe thấy tiếng. Hãy thử lại.";
      }
    };
  }
}
